<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SyncMyPod</title>
  <meta name="description" content="Self-hosted music library manager for classic iPods.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <!--
    The app shell. Everything inside #app is rendered by JavaScript; these
    landmarks exist so the layout does not shift once the first view mounts.
  -->
  <div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <rect x="5" y="2" width="14" height="20" rx="3"/>
            <circle cx="12" cy="15.5" r="3.6"/>
            <path d="M8.5 6h7"/>
          </svg>
        </span>
        <span class="brand-text">SyncMyPod</span>
      </div>

      <nav class="nav" id="nav" aria-label="Main"></nav>

      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-label="Toggle navigation">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <div class="topbar-title" id="page-title">Library</div>
        <div class="topbar-actions" id="page-actions"></div>
      </header>

      <div class="view" id="view"></div>

      <!-- One line, centred, at the foot of every page. The version comes from
           /api/health so nothing in the UI has to hardcode it. -->
      <footer class="app-footer" id="app-footer"></footer>
    </main>
  </div>

  <!-- Auth lives outside the shell: no sidebar, no nav, nothing to leak. -->
  <div id="auth" class="auth" hidden></div>

  <div id="boot" class="boot">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading SyncMyPod...</p>
  </div>

  <!-- Transient messages. One region, announced to screen readers. -->
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
