# The local sync app.
#
# Path-filtered: a change confined to web/ does not run this. That filtering is
# the thing that makes one repository holding two projects workable rather than
# merely tidy - without it every commit pays for both toolchains.
name: local

on:
  push:
    branches: [main]
    paths:
      - "local/**"
      - "docs/LOCAL_APP_API.md"
      - ".github/workflows/local.yml"
  pull_request:
    paths:
      - "local/**"
      - "docs/LOCAL_APP_API.md"
      - ".github/workflows/local.yml"
  # Runnable by hand, for checking a dependency bump without pushing.
  workflow_dispatch:

defaults:
  run:
    working-directory: local

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the current release. The floor matters because
        # pyPodLib requires 3.11 and users will run whatever they have.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: local/pyproject.toml

      # pypodlib talks to USB to identify a device. It only needs the library
      # present to import; no device is required for the suite, which runs
      # against simulated iPods.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Formatting
        run: ruff format --check src tests

      # Runs against pyPodLib's simulated iPods, so the device layer is
      # genuinely exercised here rather than mocked. Hardware-marked tests are
      # excluded by default and stay that way in CI.
      - name: Tests
        run: pytest -m "not hardware" --cov=syncmypod_local --cov-report=term-missing
