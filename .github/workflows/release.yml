# Builds the downloadable local app and attaches it to a GitHub Release.
#
#   git tag local-v0.1.0 && git push origin local-v0.1.0
#
# **Why a release asset rather than a file in the repository.** The build is a
# few hundred megabytes, most of it ffmpeg. Committing that would put a copy of
# it in the history permanently, and another copy for every version after -
# cloning the repository to read a Python file would mean downloading all of
# them. A release asset is downloaded only by people who want to run the thing.
#
# The build has to run on Windows because PyInstaller does not cross-compile: it
# bundles the interpreter and the native libraries of whatever machine it runs
# on. A macOS or Linux build means adding that runner here, and for macOS also
# resolving the ffmpeg licensing question noted in scripts/fetch_ffmpeg.py.
name: release

on:
  push:
    tags:
      - "local-v*"
  # Runnable by hand to check the build still works without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned rather than "3.x". PyInstaller embeds this exact interpreter
          # in the artefact, so the version people run is decided here and
          # should not change because a runner image was updated.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: local/pyproject.toml

      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller

      # The suite runs against simulated iPods, so this genuinely exercises the
      # database writer before anything is published. A broken build is worth
      # catching here rather than in a download.
      - name: Tests
        run: pytest -m "not hardware"

      - name: Build
        run: python scripts/build.py

      - name: Name the artefact
        id: artefact
        shell: bash
        run: echo "path=$(ls dist/SyncMyPod-*.zip | head -1)" >> "$GITHUB_OUTPUT"

      # Kept for a manual run too, where there is no release to attach to.
      - uses: actions/upload-artifact@v4
        with:
          name: syncmypod-windows
          path: local/dist/SyncMyPod-*.zip
          retention-days: 14

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: local/dist/SyncMyPod-*.zip
          draft: true
          generate_release_notes: true
          body: |
            The local sync app for Windows.

            Download the zip, unpack it anywhere, and run `syncmypod.exe`.
            Double-clicking opens the window; it also takes commands
            (`syncmypod.exe sync --dry-run`).

            ffmpeg is included, so there is nothing else to install.

            **Windows Defender may quarantine it on first run.** That is a false
            positive every unsigned PyInstaller build attracts, not a sign of
            anything wrong with the download. Code signing is the real fix and
            it costs money.
