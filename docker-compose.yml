# SyncMyPod - the web library manager plus its own PostgreSQL database.
#
# This stack is entirely self-contained. It shares no network, no volume and no
# database with anything else on the host, so it can be started, stopped, rebuilt
# or deleted without touching any other application running here.
#
#   cp .env.example .env      # then edit it
#   docker compose up -d --build
#   docker compose exec app npm run create-user
#
# All state lives in the `db` service, so one `pg_dump` is a complete backup.

name: syncmypod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # A ceiling, so this stack cannot starve anything else on a shared host.
    mem_limit: ${DB_MEM_LIMIT:-512m}
    # Docker defaults this to 64MB, which is where "could not resize shared
    # memory segment" comes from. Postgres uses it for parallel query workers,
    # which the library search does use.
    shm_size: ${DB_SHM_SIZE:-256m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${DB_USER:-syncmypod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-syncmypod}
    volumes:
      - syncmypod-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-syncmypod} -d ${DB_NAME:-syncmypod}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    mem_limit: ${APP_MEM_LIMIT:-512m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${DB_USER:-syncmypod}:${DB_PASSWORD}@db:5432/${DB_NAME:-syncmypod}
      # Signs session cookies. Changing it logs everyone out; losing it is
      # harmless beyond that.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Metadata providers. Spotify is optional - without it the resolver falls
      # back to MusicBrainz and the app still works, just less accurately.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      # MusicBrainz asks every client to identify itself and contact details.
      # Anonymous or spoofed agents get rate-limited or blocked.
      MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT:-}
    # BIND_ADDR decides who can reach this. Default is loopback only, which is
    # the safe thing to be wrong about: set it to a private/VPN address (or
    # 0.0.0.0 behind your own TLS terminator) deliberately, not by accident.
    #
    # When the `public` profile is enabled, Caddy fronts the app instead and
    # this mapping should be removed (set APP_PORTS_ENABLED=false and use the
    # caddy service's ports), so that Caddy is the only way in and its
    # X-Forwarded-For can be trusted.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3010}:8080"

  # ---- Optional: public HTTPS on your own domain ---------------------------
  #
  # Not started by default. `docker compose up -d` brings up just the app and
  # its database, reachable only on BIND_ADDR above. To publish it:
  #
  #   docker compose --profile public up -d --build
  #
  # An off-by-default profile rather than a commented-out block, because
  # "exposed to the internet" should be something you switch on deliberately,
  # and because leaving it in the file means it stays tested and maintained.
  caddy:
    build: ./caddy
    restart: unless-stopped
    profiles: ["public"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # These deliberately do NOT use Compose's `${VAR:?error}` required syntax.
      # Compose interpolates every service's variables even when the service's
      # profile is inactive, so a required variable here would make a plain
      # `docker compose up` fail for anyone not publishing publicly. The check
      # happens in the container's entrypoint instead - see caddy/Dockerfile.
      #
      # The bare hostname, e.g. syncmypod.example.org. No scheme, no port.
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
      # Stated once and used for both the listener and the published port below,
      # so the two can never drift apart.
      PUBLIC_PORT: ${PUBLIC_PORT:-8444}
      # DuckDNS token, used for the DNS-01 certificate challenge.
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # 0 until the certificate is confirmed working. See caddy/Caddyfile.
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
    ports:
      # Public HTTPS. 0.0.0.0 is intentional here - this is the listener that is
      # meant to be reachable, and the only one terminating TLS.
      #
      # The app's own port mapping above stays as it is: it serves the tailnet
      # directly over plain HTTP, which is useful and costs nothing. That is
      # also why TRUST_PROXY should be set to the Docker subnet rather than to
      # a hop count - the app has two paths in, and only one of them (this one)
      # may be believed about X-Forwarded-For.
      - "0.0.0.0:${PUBLIC_PORT:-8444}:${PUBLIC_PORT:-8444}"
    volumes:
      # Certificates and ACME account keys. Losing this volume means re-issuing
      # certificates, which Let's Encrypt rate-limits, so it is a named volume
      # rather than anything ephemeral.
      - syncmypod-caddy-data:/data
      - syncmypod-caddy-config:/config

volumes:
  syncmypod-db:
  syncmypod-caddy-data:
  syncmypod-caddy-config:
