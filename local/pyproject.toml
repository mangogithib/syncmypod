[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syncmypod-local"
version = "0.2.2"
description = "Syncs a SyncMyPod library to a classic iPod. The only component that touches audio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohamed" }]
keywords = ["ipod", "itunesdb", "music", "sync"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
]

# Pinned with lower bounds only, except pypodlib.
#
# pypodlib is pinned to an exact version on purpose: at 0.1.0 it is alpha and
# its API may move without warning, and it is the component that writes the
# iPod's database. A surprise upgrade there is the one that corrupts a device.
# Raise it deliberately, after testing on real hardware.
dependencies = [
  # The artwork extra (numpy + Pillow) is not optional here. Without it the
  # iPod's own artwork database cannot be written, and album art that is sitting
  # in the file's tags simply never appears on the device screen - which reads
  # as the feature being broken rather than as an extra not installed.
  "pypodlib[artwork]==0.1.0",
  "yt-dlp>=2025.1.1",
  "mutagen>=1.47.0",
  "httpx>=0.27.0",
  "platformdirs>=4.2.0",
  "rich>=13.7.0",
  # Windows ships no system timezone database, so zoneinfo has nothing to read
  # and pypodlib cannot parse an iTunesDB at all - it looks up the timezone the
  # iPod itself is set to. Found on a real Classic set to Europe/Dublin, where
  # the library read failed outright. Every other platform has one already.
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "respx>=0.21.0",
]

[project.scripts]
syncmypod = "syncmypod_local.cli:main"

[project.urls]
Repository = "https://github.com/mangogithib/syncmypod"

[tool.hatch.build.targets.wheel]
packages = ["src/syncmypod_local"]

# ---------------------------------------------------------------------------
# Linting
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import sorting
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "RUF",
]
ignore = [
  # Long lines are already capped at 96; the occasional URL or message that
  # runs over is not worth breaking across lines.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on private helpers and use fixtures that shadow builtins.
"tests/*" = ["B008"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  # Anything needing a real iPod plugged in. Excluded by default so the suite
  # runs anywhere: `pytest -m hardware` opts in.
  "hardware: requires a physically connected iPod",
  "network: reaches an external service",
]
